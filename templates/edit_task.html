
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | MemoryVault</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <style>
        .edit-wrapper {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }
        .edit-wrapper h1 { margin-bottom: 8px; }
        .edit-wrapper p { color: #666; }
        .edit-form { margin-top: 25px; }
        .edit-form label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
        }
        .edit-form input,
        .edit-form textarea,
        .edit-form select {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font: inherit;
        }
        .edit-form textarea {
            min-height: 110px;
            resize: vertical;
        }
        .edit-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .edit-actions button,
        .edit-actions a {
            padding: 11px 18px;
            border: 0;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font: inherit;
        }
        .edit-save { background: #ff5a1f; color: white; }
        .edit-cancel { background: #eee; color: #333; }
        @media (max-width: 700px) {
            .edit-wrapper { margin: 20px 12px; padding: 20px; }
        }
    </style>
</head>
<body>
    <main class="edit-wrapper">
        <h1>Edit Task</h1>
        <p>Update your task details below.</p>

        <form class="edit-form"
              method="POST"
              action="{{ url_for('edit_task', task_id=task.id) }}">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <label for="title">Task Title *</label>
            <input type="text" id="title" name="title"
                   maxlength="150" required
                   value="{{ task.title }}">

            <label for="description">Description</label>
            <textarea id="description"
                      name="description">{{ task.description or '' }}</textarea>

            <label for="due_date">Due Date</label>
            <input type="date" id="due_date" name="due_date"
                   value="{{ task.due_date.isoformat() if task.due_date else '' }}">

            <label for="priority">Priority</label>
            <select id="priority" name="priority">
                <option value="Low"
                    {% if task.priority == 'Low' %}selected{% endif %}>
                    Low
                </option>
                <option value="Medium"
                    {% if task.priority == 'Medium' %}selected{% endif %}>
                    Medium
                </option>
                <option value="High"
                    {% if task.priority == 'High' %}selected{% endif %}>
                    High
                </option>
            </select>

            <div class="edit-actions">
                <button type="submit" class="edit-save">
                    Save Changes
                </button>
                <a href="{{ url_for('dashboard') }}"
                   class="edit-cancel">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
